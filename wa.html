<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Membuka WhatsApp…</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --paper: #f5f1e8; --ink: #161513; --mute: #615c53; color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 15px/1.6 Georgia, serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { border: 1.5px solid var(--ink); padding: 28px 24px; background: #faf8f2; max-width: 380px; width: 100%; }
  a { display: inline-block; margin-top: 14px; background: #1f6f44; color: #fff; text-decoration: none; padding: 11px 22px; border-radius: 2px; font: 600 12px system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  small { display: block; margin-top: 12px; color: var(--mute); font-family: system-ui, sans-serif; font-size: 12px; }
</style>
</head>
<body>
<main>
  <p>Membuka WhatsApp untuk mengirim undangan<br><b id="who"></b></p>
  <a id="go" href="#">Buka WhatsApp</a>
  <small>Jika WhatsApp tidak terbuka otomatis, tekan tombol di atas.</small>
</main>
<script>
// Short link used by Excel guest list: /wa?n=62812...&to=Nama+Tamu
const BASE = location.origin + location.pathname.replace(/wa(\.html)?$/, "");
const MSG = `Assalamu'alaikum Warahmatullahi Wabarakatuh

Kepada Yth.
Bapak/Ibu/Saudara/i {nama}

Dengan segala kerendahan hati dan tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk hadir dan memberikan doa restu pada acara pernikahan kami:

*Nadia & Dimas*

🗓️ Minggu, 27 Desember 2026
📍 The Grand Heritage Hall, Jakarta

Untuk informasi lebih lengkap mengenai acara, Bapak/Ibu/Saudara/i dapat mengakses tautan undangan berikut:

{link}

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan turut menjadi bagian dari hari bahagia kami.

Atas perhatian dan doa restunya, kami mengucapkan terima kasih.

Wassalamu'alaikum Warahmatullahi Wabarakatuh

Kami yang berbahagia,

*Nadia & Dimas*`;

const q = new URLSearchParams(location.search);
const name = (q.get("to") || "").trim().slice(0, 80);
let num = (q.get("n") || "").replace(/\D/g, "");
if (num.startsWith("0")) num = "62" + num.slice(1); else if (num.startsWith("8")) num = "62" + num;
const link = BASE + "?to=" + encodeURIComponent(name).replace(/%20/g, "+");
const text = MSG.replaceAll("{nama}", name || "Bapak/Ibu/Saudara/i").replaceAll("{link}", name ? link : BASE);
const url = (num ? "https://wa.me/" + num : "https://wa.me/") + "?text=" + encodeURIComponent(text);
document.getElementById("who").textContent = name;
document.getElementById("go").href = url;
location.replace(url);
</script>
</body>
</html>
